<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML DOM Tree Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🌳 HTML DOM Tree Visualizer</h1>
      <p class="subtitle">Parse HTML and visualize the DOM tree structure</p>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Left Panel: Input -->
      <div class="panel input-panel">
        <div class="panel-header">
          <h2>HTML Input</h2>
          <div class="button-group">
            <button id="sampleBtn" class="btn btn-secondary" title="Load sample HTML">Sample</button>
            <button id="clearBtn" class="btn btn-secondary" title="Clear input">Clear</button>
            <button id="parseBtn" class="btn btn-primary" title="Parse HTML">Parse & Visualize</button>
          </div>
        </div>
        <textarea 
          id="htmlInput" 
          class="html-input" 
          placeholder="Enter your HTML here...
Example:
&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;Hello World&lt;/h1&gt;
  &lt;p&gt;Welcome to the DOM visualizer&lt;/p&gt;
&lt;/div&gt;"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Right Panel: Tree + Details -->
      <div class="panel output-panel">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab active" data-tab="tree">DOM Tree</button>
          <button class="tab" data-tab="details">Node Details</button>
          <button class="tab" data-tab="stats">Statistics</button>
        </div>

        <!-- Tab Content -->
        <div class="tab-content">
          <!-- Tree Tab -->
          <div class="tab-pane active" id="tab-tree">
            <div class="panel-header">
              <h2>DOM Tree Structure</h2>
              <div class="button-group">
                <input 
                  type="text" 
                  id="searchInput" 
                  class="search-input" 
                  placeholder="Search nodes..."
                >
                <button id="expandAllBtn" class="btn btn-icon" title="Expand all nodes">⬇</button>
                <button id="collapseAllBtn" class="btn btn-icon" title="Collapse all nodes">⬆</button>
                <button id="copyBtn" class="btn btn-secondary" title="Copy tree as JSON">Copy JSON</button>
                <button id="exportBtn" class="btn btn-secondary" title="Download tree as JSON">Export</button>
              </div>
            </div>
            <div id="treeContainer" class="tree-container">
              <div id="treeDisplay" class="tree-display">
                <p class="empty-state">Parse HTML to see the DOM tree</p>
              </div>
            </div>
          </div>

          <!-- Details Tab -->
          <div class="tab-pane" id="tab-details">
            <div class="panel-header">
              <h2>Node Details</h2>
            </div>
            <div id="nodeInfo" class="node-info">
              <p class="empty-state">Select a node to view details</p>
            </div>
          </div>

          <!-- Stats Tab -->
          <div class="tab-pane" id="tab-stats">
            <div class="panel-header">
              <h2>Tree Statistics</h2>
            </div>
            <div id="stats" class="stats-container">
              <p class="empty-state">Parse HTML to see statistics</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>HTML DOM Tree Visualizer • Built with Vanilla JavaScript</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/parser.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
